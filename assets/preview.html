<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfuse icons and buttons</title>
<style>
  :root {
    --accent: #3D9BFF; --muted: #98989F; --panel: #1C1C1E; --sidebar: #141417; --base: #0D0D10;
    --text: #EBEBF5; --line: #2A2A2E; --icon: var(--text);
    --btn: #2C2C30; --btn-hover: #3E3E43; --btn-active: #1F3A5C;
    --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
    --font: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
    --ease: 160ms ease-out;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--base); color: var(--text); font: 16px/1.6 var(--font); }
  header { display: flex; gap: var(--s3); align-items: center; padding: var(--s5) var(--s6) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header > img { width: 48px; height: 48px; }
  h1 { font: 600 28px/1.2 var(--display); margin: 0; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }
  .tint { margin-left: auto; display: flex; gap: var(--s2); }
  .tint button { font: inherit; font-size: 14px; color: var(--text); background: var(--btn); border: 0; border-radius: 14px; padding: var(--s1) var(--s3); min-height: 36px; cursor: pointer; transition: background var(--ease); }
  .tint button:hover { background: var(--btn-hover); }
  .tint button[aria-pressed="true"] { background: var(--btn-active); color: var(--accent); }
  .tint button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  main { padding: var(--s4) var(--s6) var(--s6); }
  h2 { font: 600 13px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: var(--s5) 0 var(--s3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: var(--s3); }
  .card { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s3); color: var(--icon); }
  .sizes { display: flex; gap: var(--s3); align-items: center; }
  .sz { display: block; line-height: 0; }
  .big { display: flex; justify-content: center; padding: var(--s3) 0; background: var(--sidebar); border-radius: 10px; line-height: 0; }
  figcaption { display: flex; flex-direction: column; color: var(--text); min-width: 0; }
  figcaption strong { font-weight: 600; }
  figcaption span { color: var(--muted); font-size: 14px; }
  figcaption code { color: var(--muted); font: 12px/1.6 ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheets { display: flex; flex-direction: column; gap: var(--s3); }
  .sheets img { max-width: 100%; height: auto; display: block; }
  .brand { display: flex; gap: var(--s5); align-items: flex-end; flex-wrap: wrap; }
  .brand figure { margin: 0; display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
  .brand figcaption code { white-space: normal; }
  @media (max-width: 640px) { header, main { padding-left: var(--s3); padding-right: var(--s3); } .tint { margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <img src="brand/perfuse-app-icon.svg" alt="Perfuse app icon">
  <div>
    <h1>Perfuse icons and buttons</h1>
    <p>66 icons on a 24px grid with 1.5px rounded strokes. Each icon takes the colour of the text around it; shown here at 16, 20, 24 and 48px.</p>
  </div>
  <div class="tint" role="group" aria-label="Icon colour">
    <button type="button" data-c="var(--text)" aria-pressed="true">Text</button>
    <button type="button" data-c="var(--muted)" aria-pressed="false">Muted</button>
    <button type="button" data-c="var(--accent)" aria-pressed="false">Accent</button>
  </div>
</header>

<script>
  const btns = document.querySelectorAll('.tint button');
  btns.forEach((b) => b.addEventListener('click', () => {
    document.documentElement.style.setProperty('--icon', b.dataset.c);
    btns.forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  }));
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfuse — Multiple servers</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="titlebar">
      <button class="icon-btn" type="button" data-action="back" data-fk="title-back" aria-label="Back" id="back-btn"></button>
      <div class="brand" aria-label="Perfuse">
        <svg viewBox="84 56 124 140" aria-hidden="true"><clipPath id="pf-mark"><path d="M88 74c0-10.8 11.7-17.5 21-12.1l88.6 51.2c9.4 5.4 9.4 18.8 0 24.2L109 188.5c-9.3 5.4-21-1.3-21-12.1z"/></clipPath><g clip-path="url(#pf-mark)"><rect x="60" y="54" width="160" height="41.33" fill="#8CC8FF"/><rect x="60" y="107.33" width="160" height="41.33" fill="#3D9BFF"/><rect x="60" y="160.67" width="160" height="41.33" fill="#1F6CCB"/></g></svg>
        <span>PERFUSE</span>
      </div>
      <div class="od-fill"></div>
      <!-- Native window chrome (unchanged; drawn by the OS-level title bar in the Rust app) -->
      <div class="win-ctrls" aria-hidden="true" id="win-ctrls"></div>
    </header>
    <div class="body" id="body">
      <nav class="sidebar" id="sidebar" aria-label="Servers and libraries"></nav>
      <main class="main" id="main">
        <div class="content" id="content" tabindex="-1"></div>
        <div id="dock-slot"></div>
      </main>
    </div>
  </div>

  <dialog class="modal" id="add-dialog" aria-labelledby="add-dialog-title">
    <div class="modal-body" id="add-dialog-body"></div>
  </dialog>

  <dialog class="modal confirm" id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="modal-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" data-action="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" data-action="confirm-ok" id="confirm-ok">Remove</button>
      </div>
    </div>
  </dialog>

  <div class="visually-hidden" aria-live="polite" id="live"></div>
  <div id="toast-slot"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shelves.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

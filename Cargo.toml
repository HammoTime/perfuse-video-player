[package]
name = "perfuse"
version = "0.7.6"
edition = "2024"
rust-version = "1.88"
description = "A native Plex, Jellyfin and Audiobookshelf desktop client with mpv playback"
license = "AGPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false }
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.33", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libloading = "0.8"
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }

[build-dependencies]
embed-resource = "3"
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
egui_kittest = { version = "=0.33.3", features = ["eframe", "wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies]
ring = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
lto = "thin"
strip = true
